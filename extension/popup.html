<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishLens XAI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1E293B;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #FFFFFF;
    }
    .brand h1 span {
      color: #22D3EE;
    }
    .settings-link {
      background: none;
      border: none;
      color: #64748B;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      transition: color 0.15s ease;
    }
    .settings-link:hover {
      color: #22D3EE;
    }
    .card {
      background-color: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748B;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
      background: #0F172A;
      border: 1px solid #334155;
      color: #94A3B8;
    }
    .source-badge.active {
      background: rgba(34, 211, 238, 0.12);
      border-color: rgba(34, 211, 238, 0.4);
      color: #22D3EE;
    }
    .url-display {
      font-size: 12px;
      color: #CBD5E1;
      word-break: break-all;
      background: #0F172A;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      max-height: 72px;
      overflow-y: auto;
    }
    .unwrapped-box {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(14, 165, 233, 0.1);
      border: 1px solid rgba(14, 165, 233, 0.3);
      font-size: 11px;
      color: #38BDF8;
      word-break: break-all;
    }
    .unwrapped-box strong {
      color: #BAE6FD;
      font-weight: 600;
    }
    .warning-box {
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-size: 11px;
      color: #F87171;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .primary-btn {
      width: 100%;
      background: #22D3EE;
      color: #0F172A;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
    }
    .primary-btn:hover:not(:disabled) {
      background: #67E8F9;
    }
    .primary-btn:active:not(:disabled) {
      transform: scale(0.99);
    }
    .primary-btn:disabled {
      background: #334155;
      color: #64748B;
      cursor: not-allowed;
      opacity: 0.8;
    }
    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      color: #64748B;
    }
    .footer a {
      color: #94A3B8;
      text-decoration: none;
    }
    .footer a:hover {
      color: #22D3EE;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon-48.png" alt="PhishLens" />
      <h1>Phish<span>Lens</span> XAI</h1>
    </div>
    <button id="open-options-btn" class="settings-link" title="Options / Settings" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <div class="card">
    <div class="card-label">
      <span>Target Page URL</span>
      <span id="source-badge" class="source-badge">Detecting…</span>
    </div>
    <div id="active-url" class="url-display" title="">Loading…</div>
    <div id="unwrapped-container" class="unwrapped-box" style="display: none;">
      Scanning the real destination: <strong id="unwrapped-url"></strong>
    </div>
  </div>

  <div id="warning-message" class="warning-box" style="display: none;"></div>

  <button id="scan-btn" class="primary-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    Scan this page
  </button>

  <div class="footer">
    <a href="#" id="options-link">Configure dashboard URL</a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
