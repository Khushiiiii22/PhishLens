<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishLens XAI — Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background-color: #1E293B;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #334155;
    }
    .header img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .header h1 span {
      color: #22D3EE;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94A3B8;
      margin-bottom: 6px;
    }
    .help-text {
      font-size: 12px;
      color: #64748B;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      background-color: #0F172A;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      color: #F8FAFC;
      font-family: monospace, sans-serif;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="text"]:focus {
      border-color: #22D3EE;
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
    }
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed #334155;
    }
    .secondary-btn {
      background: #0F172A;
      color: #94A3B8;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .secondary-btn:hover {
      border-color: #22D3EE;
      color: #22D3EE;
    }
    .btn-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }
    .primary-btn {
      background: #22D3EE;
      color: #0F172A;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .primary-btn:hover {
      background: #67E8F9;
    }
    .status-msg {
      font-size: 12px;
      font-weight: 500;
      min-height: 20px;
      transition: opacity 0.2s ease;
    }
    .status-msg.success {
      color: #34D399;
    }
    .status-msg.error {
      color: #F87171;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon-48.png" alt="PhishLens" />
      <h1>Phish<span>Lens</span> XAI — Settings</h1>
    </div>

    <form id="options-form">
      <div class="form-group">
        <label for="api-url">API Base URL</label>
        <p class="help-text">
          Backend API server URL used for phishing scans (default: http://localhost:8000).
        </p>
        <input
          id="api-url"
          type="text"
          placeholder="http://localhost:8000"
          spellcheck="false"
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <label for="dashboard-url">Dashboard URL</label>
        <p class="help-text">
          Web application endpoint opened if you click "View Full Web Dashboard" or context menu links (default: http://localhost:5173).
        </p>
        <input
          id="dashboard-url"
          type="text"
          placeholder="http://localhost:5173"
          spellcheck="false"
          autocomplete="off"
        />
      </div>

      <div class="quick-actions">
        <button id="btn-use-localhost" type="button" class="secondary-btn">
          ⚡ Use localhost (API: http://localhost:8000)
        </button>
        <button id="btn-use-render" type="button" class="secondary-btn">
          ☁️ Reset to Render Default (phishlens-doyc.onrender.com)
        </button>
      </div>

      <div class="btn-row">
        <button id="save-btn" type="submit" class="primary-btn">
          Save Settings
        </button>
        <div id="status" class="status-msg"></div>
      </div>
    </form>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
